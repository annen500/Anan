name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows app
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --name BarisAI
          --collect-all kivy --collect-all kivy_deps.sdl2
          --collect-all kivy_deps.glew --collect-all kivy_deps.angle main.py

      - name: Zip app folder
        run: Compress-Archive -Path dist/BarisAI -DestinationPath BarisAI-Windows.zip -Force
        shell: pwsh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarisAI-Windows
          path: BarisAI-Windows.zip
          if-no-files-found: error